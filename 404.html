  <style>
    :root {
      --bg-dark: #0b0b0b;
      --accent-purple: #a855f7;
      --accent-deep: #7c3aed;
      --accent-glow: #4c1d95;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: clip; max-width: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(ellipse at top, rgba(76, 29, 149, 0.45), transparent 55%),

      color: #fff;
    }
    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 40px 28px;
      background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.12);
    }
    .code {
      font-size: clamp(3.5rem, 14vw, 5rem);
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-deep));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    p {
      color: #9ca3af;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-deep));
    }
    .secondary {
      color: #d1d5db;
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .email {
      margin-top: 22px;
      font-size: 0.9rem;
    }
    .email a { color: var(--accent-purple); padding: 0; background: none; font-weight: 600; }
